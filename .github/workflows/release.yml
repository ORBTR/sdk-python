# Tests and builds the tagged version (an sdist and a wheel), attaches them and their checksums to the GitHub
# release, then publishes them to PyPI as orbtr. Publishing runs only when the PYPI_TOKEN secret is set (a
# PyPI API token scoped to the orbtr project); without it the job warns and publishes nothing. The token
# reaches twine through the environment only.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -e . pytest==9.1.1 build==1.3.0 twine==6.2.0
      - run: python scripts/generate.py --check
      - run: python -m pytest -q
      - name: Check the tag names the package's version
        run: |
          version="$(python -c 'import orbtr; print(orbtr.__version__)')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Build
        run: |
          python -m build
          python -m twine check dist/*
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - run: python -m pip install twine==6.2.0
      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*.whl dist/*.tar.gz
      - name: Name the registry left out
        if: env.HAS_PYPI_TOKEN != 'true'
        run: echo "::warning::PYPI_TOKEN is not set: PyPI was not published to"
