# Tests the package on each supported Python release: the unit tests against the recorded fixtures, the
# integration test against the local fake of the /v1 surface, and the check that src/orbtr/_generated is what
# contract/orbtr-v1.json generates.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest==9.1.1
      - run: python scripts/generate.py --check
      - run: python -m pytest -q
